# Databases — Deep Dive Canvas
# Inspired by https://survey.stackoverflow.co/2025/#databases

type: canvas
display_name: "Databases"

defaults:
  time_range: P6Y

rows:
  - items:
      - kpi_grid:
          measures:
            - unique_users
            - mentions
            - median_compensation
          metrics_view: database_metrics
          dimension_filters: relationship IN ('Used')
        width: 12
    height: 150px
  - items:
      - leaderboard:
          metrics_view: database_metrics
          dimensions:
            - database_name
          measures:
            - unique_users
          num_rows: 15
          dimension_filters: relationship IN ('Used')
          title: Most Used Databases (All Years)
        width: 6
      - stacked_bar:
          metrics_view: database_metrics
          x:
            field: survey_year
            type: nominal
          y:
            field: unique_users
            type: quantitative
          color:
            field: database_name
            type: nominal
            limit: 10
          dimension_filters: relationship IN ('Used')
          title: Database Adoption Over Time
        width: 6
    height: 452px
  - items:
      - leaderboard:
          metrics_view: database_metrics
          dimensions:
            - database_name
          measures:
            - unique_users
          num_rows: 15
          dimension_filters: relationship IN ('Desired')
          title: Most Desired Databases
        width: 12
    height: 452px
  - items:
      - leaderboard:
          metrics_view: database_metrics
          dimensions:
            - database_name
          measures:
            - median_compensation
          num_rows: 15
          dimension_filters: relationship IN ('Used')
          title: Highest-Paying Databases (Median Comp)
        width: 6
      - bar_chart:
          metrics_view: database_metrics
          x:
            field: database_name
            type: nominal
            limit: 12
          y:
            field: avg_compensation
            type: quantitative
          dimension_filters: relationship IN ('Used')
          title: Avg Compensation by Database
        width: 6
    height: 350px
  - items:
      - stacked_bar:
          metrics_view: database_metrics
          x:
            field: experience_level
            type: nominal
          y:
            field: unique_users
            type: quantitative
          color:
            field: database_name
            type: nominal
            limit: 8
          dimension_filters: relationship IN ('Used')
          title: Database Usage by Experience Level
        width: 6
      - leaderboard:
          metrics_view: database_metrics
          dimensions:
            - country
          measures:
            - unique_users
          num_rows: 15
          dimension_filters: relationship IN ('Used')
          title: Top Countries Using Databases
        width: 6
    height: 350px
  - items:
      - pie_chart:
          metrics_view: database_metrics
          color:
            field: database_name
            type: nominal
            limit: 10
          measure:
            field: unique_users
            type: quantitative
          innerRadius: 50
          dimension_filters: relationship IN ('Used')
          title: Database Market Share
        width: 6
      - stacked_bar:
          metrics_view: database_metrics
          x:
            field: database_name
            type: nominal
            limit: 10
          y:
            field: unique_users
            type: quantitative
          color:
            field: remote_work
            type: nominal
          dimension_filters: relationship IN ('Used')
          title: Database Usage by Work Mode
        width: 6
    height: 350px

filters:
  enable: true

theme: theme
