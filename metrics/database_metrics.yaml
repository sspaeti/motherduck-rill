# Metrics on database_analysis (one row per respondent × database × relationship)
# For database popularity, admired/desired analysis, and compensation comparison

version: 1
type: metrics_view

display_name: "Database Metrics"
model: database_analysis
timeseries: survey_date
smallest_time_grain: "year"

# ─── Dimensions ─────────────────────────────────────
dimensions:
  - name: survey_year
    column: survey_year
    display_name: Survey Year

  - name: database_name
    column: database_name
    display_name: Database

  - name: relationship
    column: relationship
    display_name: Relationship (Used/Admired/Desired)

  - name: country
    column: country
    display_name: Country

  - name: experience_level
    column: experience_level
    display_name: Experience Level

  - name: remote_work
    column: remote_work
    display_name: Remote Work

  - name: org_size
    column: org_size
    display_name: Organization Size

  - name: is_data_engineer
    column: is_data_engineer
    display_name: Data Engineer?

  - name: dev_type
    column: dev_type
    display_name: Developer Type

# ─── Measures ───────────────────────────────────────
measures:
  - name: mentions
    display_name: "Mentions"
    expression: COUNT(*)
    format_preset: humanize

  - name: unique_users
    display_name: "Unique Users"
    expression: COUNT(DISTINCT ResponseId)
    format_preset: humanize

  - name: avg_compensation
    display_name: "Avg Compensation"
    expression: AVG(comp_annual)
    format_preset: currency_usd

  - name: median_compensation
    display_name: "Median Compensation"
    expression: MEDIAN(comp_annual)
    format_preset: currency_usd
